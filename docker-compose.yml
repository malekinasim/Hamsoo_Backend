services:
  app:
    build:
      context: .
    container_name: hamsoo-app
    ports:
      - "8989:8989"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hamsoo_db
      SPRING_DATASOURCE_USERNAME: hamsoo_user
      SPRING_DATASOURCE_PASSWORD: ${HAMSOO_DB_PASSWORD:-change-me}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_OPTS: -Xms256m -Xmx512m
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    container_name: hamsoo-db
    environment:
      POSTGRES_DB: hamsoo_db
      POSTGRES_USER: hamsoo_user
      POSTGRES_PASSWORD: ${HAMSOO_DB_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres-data:
