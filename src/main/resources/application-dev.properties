server.ssl.key-store=${HAMSOO_SSL_KEYSTORE:}
server.ssl.key-alias=hamsoo
server.ssl.key-password=${HAMSOO_SSL_KEY_PASSWORD:}
server.ssl.key-store-type=pkcs12
server.ssl.key-store-password=${HAMSOO_SSL_KEYSTORE_PASSWORD:}
server.ssl.enabled=${HAMSOO_SSL_ENABLED:false}

#Server
hamsoo.server.address=https://localhost
server.port=8085
#mail
hamsoo.mail.verify.url=http://localhost:3000/app/VerifyEmail

#datasource
app.oauth2.authorizedRedirectUris=http://localhost:3000/app/redirect
logging.level.org.springframework.web.client.RestTemplate=DEBUG
spring.datasource.url= jdbc:postgresql://localhost:5432/hamsoo-db
spring.datasource.username=hamsoo-user
spring.datasource.password=${HAMSOO_DB_PASSWORD:}

#cors origins
cors.allowedOrigins=http://localhost:3000
cors.allowedMethods=GET,POST,PUT,OPTIONS,DELETE
cors.allowedHeaders=Authorization,Content-Type,Content-Length,Content-Disposition,Pragma,Cache-Control,origin, x-requested-with, refreshToken, curOrgan
cors.maxAge=3600

#ssl
hamsoo.server.ssl.enabled=${HAMSOO_SSL_ENABLED:false}

#fcm
fcm.service-account-file=fcm/hamsoo-firebase-adminsdk-dev.json
fcm.notification-icon-url=${cors.allowedOrigins}/assets/images/hamsoo-logo-byname.png

#log
logging.directory=C:/hamsoo-log
logging.file.name=${logging.directory}/hamsoo-log.log
#max size of each archived file
logging.logback.rollingpolicy.max-file-size=2MB
#max total size of all archive files.older archived file will be deleted.
logging.logback.rollingpolicy.total-size-cap=20MB
#days to keep
logging.logback.rollingpolicy.max-history=10
#log levels
logging.level.root=INFO
logging.level.com.hamsoo.bpm=TRACE
logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql=TRACE

#Springdoc
#disabling the /v3/api-docs endpoint & swagger-ui
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


scheduler.enabled=true


