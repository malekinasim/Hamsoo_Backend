#Profiling
spring.profiles.active=dev
#spring.profiles.active=test
spring.application.name=hamsoo
server.servlet.context-path=/hamsoo
server.tomcat.uri-encoding=UTF-8
server.error.whitelabel.enabled=false
server.error.include-exception=true
server.error.include-stacktrace=always
server.max-http-header-size=20KB
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
#checking request map for get MethodHandler form request
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
#server.tomcat.max-swallow-size must little bigger than spring.servlet.multipart.max-request-size
server.tomcat.max-swallow-size=30MB
server.tomcat.max-http-form-post-size=5MB
spring.servlet.multipart.max-file-size = 5MB
spring.servlet.multipart.max-request-size = 20MB

spring.datasource.initialize=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## mailserver Rest API
spring.mail.default-encoding=UTF-8
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hamsoo@gmail.com
spring.mail.password=${HAMSOO_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
hamsoo.mail.templates.path=/templates/email/
hamsoo.sinup.mail.template.name=registration.html
logo.url=${hamsoo.mail.templates.path}images/round-4x.png
hamsoo.confirmEmail.url=${hamsoo.mail.templates.path}images/email_confirm.png
hamsoo.logo.url=${hamsoo.mail.templates.path}images/hamsoo-logo-byname.png


hamsoo.default.user.role=USER
hamsoo.default.user.organ=PUBLIC
hamsoo.default.provider=hamsoo

## Camunda Rest API
#rest.security.eabled=true
#rest.security.provider=hamsoo
#rest.security.required-audience=camunda-rest-api
#camunda.bpm.authorization.enabled=true
#camunda.bpm.admin-user.id=admin

hamsoo.locale=fa
##5 min
hamsoo.jwt.expiration=300000
##24h
hamsoo.jwt.refreshExpirationMs=86400000
hamsoo.jwt.secret=${HAMSOO_JWT_SECRET:}
hamsoo.jwt.expiration.accesstoken.cookiename:accessToken
hamsoo.curernt.organ.cookiename: curOrgan

## Frame Rest API
com.frame.base.url=https://frame.hamsoo.com
com.frame.sms.url=${com.frame.base.url}/api/nc/do/sms_service/rest/v1.0
com.frame.login.url=${com.frame.base.url}/api/auth/token/rest/v1.0
com.frame.username=hamsoo
com.frame.password=${HAMSOO_SMS_PASSWORD:}

##hamsoo  mail or sms token expiration time in milliseconds
hamsoo.resetpass.token.sms.expiration=120000
hamsoo.resetpass.page.expiration=600000
hamsoo.resetpass.token.mail.expiration=3600000
hamsoo.signup.token.sms.expiration=180000
hamsoo.mailverify.token.mail.expiration=86400000

spring.main.allow-bean-definition-overriding=true
##hamsoo ouath2 request class path  for google or hamsoo frame
com.hamsoo.bpm.common.config.security.model.dto.hamsoouserdetail.oauth2userinfo.hamsoo=com.hamsoo.bpm.common.config.security.model.dto.hamsoouserdetail.OAuth2UserInfo
com.hamsoo.bpm.common.config.security.model.dto.hamsoouserdetail.oauth2userinfo.github=com.hamsoo.bpm.common.config.security.model.dto.hamsoouserdetail.OAuth2UserInfo
com.hamsoo.bpm.common.config.security.model.dto.hamsoouserdetail.oauth2userinfo.google=com.hamsoo.bpm.common.config.security.model.dto.hamsoouserdetail.oauth2userinfo.GoogleOAuth2UserInfo
#image profile validation config
hamsoo.profile.image.multipart.max-size=51200
hamsoo.profile.image.multipart.file-type=image/jpeg,image/png,image/jpg,image/gif
#image organ validation config
hamsoo.organ.image.multipart.max-size=51200
hamsoo.organ.image.multipart.file-type=image/jpeg,image/png,image/jpg,image/gif
#fcm
fcm.ttl=300
#Springdoc order-by Config
springdoc.swagger-ui.docExpansion=none
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.tagsSorter: alpha



